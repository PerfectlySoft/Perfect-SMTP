name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (Swift ${{ matrix.swift }}, ${{ matrix.configuration }})
    runs-on: ubuntu-24.04
    container: swift:${{ matrix.swift }}-noble
    timeout-minutes: 30
    env:
      # A crashing test should fail fast with its own output, not spend minutes symbolicating.
      SWIFT_BACKTRACE: enable=no
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported Swift (swift-tools-version 6.2) and the newest.
        swift: ["6.2", "6.4"]
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: swift --version

      - name: Build (warnings are errors)
        run: |
          flags="-c ${{ matrix.configuration }} -Xswiftc -warnings-as-errors"
          # @testable imports need testing enabled in an optimized build.
          [ "${{ matrix.configuration }}" = release ] && flags="$flags -Xswiftc -enable-testing"
          echo "FLAGS=$flags" >> "$GITHUB_ENV"
          swift build --build-tests $flags

      # Hermetic: every test runs against in-process fakes on 127.0.0.1, with no DNS,
      # internet or external SMTP server (linux-offline below enforces it).
      - name: Test
        run: swift test $FLAGS

  # The suite must not need the network. A job container can't drop its
  # network, so this runs docker directly: resolve with the network, then
  # build and test in a container that has none.
  linux-offline:
    name: Linux (Swift 6.4, no network)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Resolve dependencies (networked)
        run: docker run --rm -v "$PWD:/src" -w /src swift:6.4-noble swift package resolve

      - name: Build and test with --network none
        run: |
          docker run --rm --network none -e SWIFT_BACKTRACE=enable=no -v "$PWD:/src" -w /src swift:6.4-noble \
            bash -c "swift build --build-tests -Xswiftc -warnings-as-errors && swift test --skip-build"

  macos:
    name: macOS (Xcode ${{ matrix.xcode }}, ${{ matrix.configuration }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest Xcode with Swift 6.2, and the runner's default.
        xcode: ["26.0.1", "26.6"]
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
          swift --version

      - name: Build (warnings are errors)
        run: |
          flags="-c ${{ matrix.configuration }} -Xswiftc -warnings-as-errors"
          # @testable imports need testing enabled in an optimized build.
          [ "${{ matrix.configuration }}" = release ] && flags="$flags -Xswiftc -enable-testing"
          echo "FLAGS=$flags" >> "$GITHUB_ENV"
          swift build --build-tests $flags

      - name: Test
        run: swift test $FLAGS
